<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RouteOptimizer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      height: 100vh;
      background: #1a1a2e;
      color: #eee;
    }

    /* ===== SIDEBAR ===== */
    #sidebar {
      width: 340px;
      min-width: 340px;
      background: #16213e;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 16px;
      overflow-y: auto;
      z-index: 10;
      box-shadow: 4px 0 20px rgba(0,0,0,0.4);
    }

    #sidebar h1 {
      font-size: 1.3rem;
      color: #4cc9f0;
      letter-spacing: 1px;
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #0f3460;
    }

    label.field-label {
      font-size: 0.75rem;
      color: #8899aa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      display: block;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #0f3460;
      background: #0f3460;
      color: #eee;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #4cc9f0; }

    input[type="time"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #0f3460;
      background: #0f3460;
      color: #eee;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="time"]:focus { border-color: #4cc9f0; }

    .field-group { display: flex; flex-direction: column; position: relative; }

    .autocomplete-list {
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      background: #0f3460;
      border: 1px solid #4cc9f0;
      border-radius: 8px;
      z-index: 1000;
      max-height: 200px;
      overflow-y: auto;
    }
    .autocomplete-item {
      padding: 9px 12px;
      font-size: 0.82rem;
      color: #ccc;
      cursor: pointer;
      border-bottom: 1px solid #1a4a80;
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover { background: #1a4a80; color: #fff; }

    /* ===== CATEGORIES ===== */
    .categories-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .cat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f3460;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }
    .cat-item:hover { border-color: #4cc9f0; }
    .cat-item.active { border-color: #4cc9f0; background: #1a4a80; }

    .cat-item input[type="checkbox"] { display: none; }
    .cat-icon { font-size: 1.1rem; }
    .cat-name { font-size: 0.82rem; color: #ccc; }

    .priority-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .priority-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f3460;
      border-radius: 8px;
      padding: 7px 10px;
      min-height: 36px;
    }
    .priority-row.hidden { display: none; }
    .priority-name {
      width: 92px;
      font-size: 0.78rem;
      color: #ccc;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .priority-value {
      width: 22px;
      text-align: right;
      color: #4cc9f0;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* ===== MAX POI ===== */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type="range"] {
      flex: 1;
      accent-color: #4cc9f0;
    }
    #maxPoisVal {
      min-width: 24px;
      text-align: right;
      color: #4cc9f0;
      font-weight: bold;
    }

    /* ===== TRANSPORT ===== */
    .transport-row {
      display: flex;
      gap: 8px;
    }
    .transport-btn {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #0f3460;
      background: #0f3460;
      color: #ccc;
      cursor: pointer;
      font-size: 0.82rem;
      text-align: center;
      transition: border-color 0.15s, background 0.15s;
    }
    .transport-btn.active { border-color: #4cc9f0; background: #1a4a80; color: #fff; }

    /* ===== MODE TABS ===== */
    .mode-tabs {
      display: flex;
      gap: 6px;
      background: #0f3460;
      border-radius: 10px;
      padding: 4px;
    }
    .mode-tab {
      flex: 1;
      padding: 9px;
      border-radius: 8px;
      text-align: center;
      font-size: 0.82rem;
      color: #ccc;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      user-select: none;
    }
    .mode-tab.active { background: linear-gradient(135deg,#4cc9f0,#4361ee); color: #fff; font-weight: 600; }

    /* ===== PLACES CHIPS ===== */
    .chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px 5px 10px;
      border-radius: 16px;
      background: #1a4a80;
      border: 1px solid #4cc9f0;
      color: #fff;
      font-size: 0.78rem;
    }
    .chip button {
      background: none;
      border: none;
      color: #bcd;
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
      padding: 0 2px;
    }
    .chip button:hover { color: #fff; }
    .chip .chip-sub { color: #9fc; font-size: 0.7rem; margin-left: 2px; }

    /* ===== BUILD BUTTON ===== */
    #buildBtn {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #4cc9f0, #4361ee);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.2s, transform 0.1s;
    }
    #buildBtn:hover { opacity: 0.9; }
    #buildBtn:active { transform: scale(0.98); }
    #buildBtn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ===== STATUS / RESULTS ===== */
    #status {
      font-size: 0.82rem;
      color: #f72585;
      min-height: 18px;
      text-align: center;
    }

    #results {
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      background: #0f3460;
      border-radius: 8px;
      padding: 10px 14px;
    }
    .stat-label { font-size: 0.78rem; color: #8899aa; }
    .stat-val { font-size: 0.95rem; font-weight: 600; }
    .stat-val.green { color: #4ade80; }
    .stat-val.blue { color: #60a5fa; }
    .stat-val.yellow { color: #facc15; }

    .legend {
      display: flex;
      gap: 16px;
      justify-content: center;
      font-size: 0.8rem;
      color: #aaa;
    }
    .legend-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
      vertical-align: middle;
    }

    /* ===== POI LIST ===== */
    #poiList { display: flex; flex-direction: column; gap: 6px; }
    .poi-item {
      background: #0f3460;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .poi-num {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #4cc9f0;
      color: #000;
      font-weight: bold;
      font-size: 0.72rem;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .poi-time {
      margin-left: auto;
      font-size: 0.78rem;
      color: #4cc9f0;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ===== MAP ===== */
    #map {
      flex: 1;
      z-index: 1;
    }

    /* ===== LOADER ===== */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #ffffff44;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="sidebar">
  <h1>🗺️ RouteOptimizer</h1>

  <div class="field-group">
    <label class="field-label">Вариант построения маршрута</label>
    <div class="mode-tabs">
      <div class="mode-tab active" data-mode-id="categories">По категориям</div>
      <div class="mode-tab" data-mode-id="places">По местам</div>
    </div>
  </div>

  <div class="field-group">
    <label class="field-label">Начальная точка</label>
    <input type="text" id="startAddr" placeholder="Москва, Красная площадь"/>
  </div>

  <div class="field-group mode-categories-only">
    <label class="field-label">Конечная точка</label>
    <input type="text" id="endAddr" placeholder="Москва, Парк Горького"/>
  </div>

  <div class="field-group mode-places-only" style="display:none">
    <label class="field-label">Места для посещения</label>
    <input type="text" id="placeSearch" placeholder="Введите точку интереса..."/>
    <div id="chipsWrap" class="chips-wrap"></div>
  </div>

  <div class="field-group mode-categories-only">
    <label class="field-label">Категории интересов</label>
    <div class="categories-grid">
      <label class="cat-item active">
        <input type="checkbox" value="restaurant" checked/>
        <span class="cat-icon">🍽️</span>
        <span class="cat-name">Рестораны</span>
      </label>
      <label class="cat-item active">
        <input type="checkbox" value="cafe" checked/>
        <span class="cat-icon">☕</span>
        <span class="cat-name">Кафе</span>
      </label>
      <label class="cat-item active">
        <input type="checkbox" value="museum" checked/>
        <span class="cat-icon">🏛️</span>
        <span class="cat-name">Музеи</span>
      </label>
      <label class="cat-item">
        <input type="checkbox" value="park"/>
        <span class="cat-icon">🌳</span>
        <span class="cat-name">Парки</span>
      </label>
      <label class="cat-item">
        <input type="checkbox" value="shop"/>
        <span class="cat-icon">🛒</span>
        <span class="cat-name">Магазины</span>
      </label>
      <label class="cat-item">
        <input type="checkbox" value="hotel"/>
        <span class="cat-icon">🏨</span>
        <span class="cat-name">Отели</span>
      </label>
      <label class="cat-item">
        <input type="checkbox" value="pharmacy"/>
        <span class="cat-icon">💊</span>
        <span class="cat-name">Аптеки</span>
      </label>
      <label class="cat-item">
        <input type="checkbox" value="atm"/>
        <span class="cat-icon">🏧</span>
        <span class="cat-name">Банкоматы</span>
      </label>
    </div>
  </div>

  <div class="field-group mode-categories-only">
    <label class="field-label">Приоритеты категорий</label>
    <div class="priority-list" id="categoryPriorities">
      <div class="priority-row" data-category="restaurant">
        <span class="priority-name">🍽️ Рестораны</span>
        <input type="range" class="priority-input" min="1" max="10" value="5"/>
        <span class="priority-value">5</span>
      </div>
      <div class="priority-row" data-category="cafe">
        <span class="priority-name">☕ Кафе</span>
        <input type="range" class="priority-input" min="1" max="10" value="5"/>
        <span class="priority-value">5</span>
      </div>
      <div class="priority-row" data-category="museum">
        <span class="priority-name">🏛️ Музеи</span>
        <input type="range" class="priority-input" min="1" max="10" value="5"/>
        <span class="priority-value">5</span>
      </div>
      <div class="priority-row hidden" data-category="park">
        <span class="priority-name">🌳 Парки</span>
        <input type="range" class="priority-input" min="1" max="10" value="5"/>
        <span class="priority-value">5</span>
      </div>
      <div class="priority-row hidden" data-category="shop">
        <span class="priority-name">🛒 Магазины</span>
        <input type="range" class="priority-input" min="1" max="10" value="5"/>
        <span class="priority-value">5</span>
      </div>
      <div class="priority-row hidden" data-category="hotel">
        <span class="priority-name">🏨 Отели</span>
        <input type="range" class="priority-input" min="1" max="10" value="5"/>
        <span class="priority-value">5</span>
      </div>
      <div class="priority-row hidden" data-category="pharmacy">
        <span class="priority-name">💊 Аптеки</span>
        <input type="range" class="priority-input" min="1" max="10" value="5"/>
        <span class="priority-value">5</span>
      </div>
      <div class="priority-row hidden" data-category="atm">
        <span class="priority-name">🏧 Банкоматы</span>
        <input type="range" class="priority-input" min="1" max="10" value="5"/>
        <span class="priority-value">5</span>
      </div>
    </div>
  </div>

  <div class="field-group mode-categories-only">
    <label class="field-label">Макс. точек интереса: <span id="maxPoisVal">1</span></label>
    <div class="slider-row">
      <span style="font-size:0.8rem;color:#aaa">1</span>
      <input type="range" id="maxPois" min="1" max="10" value="1"/>
      <span style="font-size:0.8rem;color:#aaa">10</span>
    </div>
  </div>

  <div class="field-group">
    <label class="field-label">Транспорт</label>
    <div class="transport-row">
      <div class="transport-btn active" data-mode="driving-car">🚗 Авто</div>
      <div class="transport-btn" data-mode="cycling-regular">🚲 Вело</div>
      <div class="transport-btn" data-mode="foot-walking">🚶 Пешком</div>
    </div>
  </div>

  <div class="field-group">
    <label class="field-label">Время отправления</label>
    <input type="time" id="departureTime" value="09:00"/>
  </div>

  <div class="field-group">
    <label class="field-label">Время окончания</label>
    <input type="time" id="endTime" value="18:00"/>
  </div>

  <button id="buildBtn">Построить маршрут</button>
  <button id="historyBtn" style="width:100%;padding:10px;border-radius:8px;border:1px solid #0f3460;background:#0f3460;color:#ccc;cursor:pointer;font-size:0.85rem;transition:border-color 0.15s">История маршрутов</button>
  <div id="historyBlock" style="display:none;flex-direction:column;gap:6px"></div>
  <div id="status"></div>

  <div id="results">
    <div class="legend">
      <span><span class="legend-dot" style="background:#f72585"></span>Исходный</span>
      <span><span class="legend-dot" style="background:#22c55e"></span>Оптимальный</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">До оптимизации</span>
      <span class="stat-val blue" id="distBefore">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">После оптимизации</span>
      <span class="stat-val green" id="distAfter">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Экономия</span>
      <span class="stat-val yellow" id="saving">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Время маршрута</span>
      <span class="stat-val" id="totalTime" style="color:#f472b6">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">⚡ C++ алгоритм</span>
      <span class="stat-val" id="compMs" style="color:#c084fc">—</span>
    </div>
    <label class="field-label" style="margin-top:4px">Точки маршрута</label>
    <div id="poiList"></div>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ===== MAP INIT =====
  const map = L.map('map', { attributionControl: false }).setView([55.7558, 37.6176], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '',
    maxZoom: 19
  }).addTo(map);

  // ===== STATE =====
  let naiveLine = null;
  let optimizedLine = null;
  let markers = [];
  let transportMode = 'driving-car';

  // ===== CATEGORY TOGGLE =====
  document.querySelectorAll('.cat-item').forEach(item => {
    item.addEventListener('click', () => {
      const cb = item.querySelector('input[type="checkbox"]');
      cb.checked = !cb.checked;
      item.classList.toggle('active', cb.checked);
      syncCategoryPriorityRows();
    });
  });

  function syncCategoryPriorityRows() {
    const activeCategories = new Set(
      [...document.querySelectorAll('.cat-item input:checked')].map(c => c.value)
    );
    document.querySelectorAll('.priority-row').forEach(row => {
      row.classList.toggle('hidden', !activeCategories.has(row.dataset.category));
    });
  }

  document.querySelectorAll('.priority-input').forEach(input => {
    input.addEventListener('input', () => {
      input.closest('.priority-row').querySelector('.priority-value').textContent = input.value;
    });
  });

  function collectCategoryPriorities() {
    const result = {};
    document.querySelectorAll('.priority-row:not(.hidden)').forEach(row => {
      const input = row.querySelector('.priority-input');
      result[row.dataset.category] = parseInt(input.value, 10);
    });
    return result;
  }

  // ===== SLIDER =====
  const maxPoisInput = document.getElementById('maxPois');
  const maxPoisVal = document.getElementById('maxPoisVal');
  maxPoisInput.addEventListener('input', () => { maxPoisVal.textContent = maxPoisInput.value; });

  // ===== TRANSPORT =====
  document.querySelectorAll('.transport-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.transport-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      transportMode = btn.dataset.mode;
    });
  });

  // ===== AUTOCOMPLETE =====
  function setupAutocomplete(inputId) {
    const input = document.getElementById(inputId);
    const wrapper = input.closest('.field-group');
    let timer = null;
    let dropdown = null;

    function removeDropdown() {
      if (dropdown) { dropdown.remove(); dropdown = null; }
    }

    input.addEventListener('input', () => {
      clearTimeout(timer);
      const q = input.value.trim();
      if (q.length < 3) { removeDropdown(); return; }

      timer = setTimeout(async () => {
        try {
          const res = await fetch(
            `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5&addressdetails=1`,
            { headers: { 'Accept-Language': 'ru' } }
          );
          const raw = await res.json();
          const seen = new Set();
          const items = raw.filter(it => {
            if (seen.has(it.display_name)) return false;
            seen.add(it.display_name);
            return true;
          });
          removeDropdown();
          if (!items.length) return;

          dropdown = document.createElement('div');
          dropdown.className = 'autocomplete-list';
          items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'autocomplete-item';
            div.textContent = item.display_name;
            div.addEventListener('click', () => {
              input.value = item.display_name;
              removeDropdown();
            });
            dropdown.appendChild(div);
          });
          wrapper.appendChild(dropdown);
        } catch {}
      }, 350);
    });

    document.addEventListener('click', e => {
      if (!wrapper.contains(e.target)) removeDropdown();
    });
  }

  setupAutocomplete('startAddr');
  setupAutocomplete('endAddr');

  // ===== MODE SWITCH =====
  let currentMode = 'categories';
  document.querySelectorAll('.mode-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentMode = tab.dataset.modeId;
      const showCat = currentMode === 'categories';
      document.querySelectorAll('.mode-categories-only').forEach(el => el.style.display = showCat ? '' : 'none');
      document.querySelectorAll('.mode-places-only').forEach(el => el.style.display = showCat ? 'none' : '');
    });
  });

  // ===== PLACES CHIPS =====
  let selectedPlaces = []; // [{name, lat, lon}]

  function renderChips() {
    const wrap = document.getElementById('chipsWrap');
    wrap.innerHTML = '';
    selectedPlaces.forEach((p, i) => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `<span>${p.name}</span><button title="Удалить">✕</button>`;
      chip.querySelector('button').addEventListener('click', () => {
        selectedPlaces.splice(i, 1);
        renderChips();
      });
      wrap.appendChild(chip);
    });
  }

  async function geocodeStartForNear() {
    const addr = document.getElementById('startAddr').value.trim();
    if (!addr) return null;
    try {
      const res = await fetch('/api/geocode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ address: addr })
      });
      if (!res.ok) return null;
      const c = await res.json();
      return `${c.lat},${c.lon}`;
    } catch { return null; }
  }

  function setupPlaceAutocomplete() {
    const input = document.getElementById('placeSearch');
    const wrapper = input.closest('.field-group');
    let timer = null;
    let dropdown = null;

    function removeDropdown() { if (dropdown) { dropdown.remove(); dropdown = null; } }

    input.addEventListener('input', () => {
      clearTimeout(timer);
      const q = input.value.trim();
      if (q.length < 2) { removeDropdown(); return; }
      timer = setTimeout(async () => {
        const near = await geocodeStartForNear();
        try {
          const url = `/api/poi/search?q=${encodeURIComponent(q)}` + (near ? `&near=${near}` : '');
          const res = await fetch(url);
          if (!res.ok) { removeDropdown(); return; }
          const items = await res.json();
          removeDropdown();
          if (!items.length) return;
          dropdown = document.createElement('div');
          dropdown.className = 'autocomplete-list';
          items.forEach(it => {
            const row = document.createElement('div');
            row.className = 'autocomplete-item';
            const sub = it.address ? `<br/><span style="color:#8af;font-size:0.72rem">${it.address}</span>` : '';
            row.innerHTML = `<b>${it.name}</b>${sub}`;
            row.addEventListener('click', () => {
              selectedPlaces.push({ name: it.name, lat: it.lat, lon: it.lon });
              renderChips();
              input.value = '';
              removeDropdown();
            });
            dropdown.appendChild(row);
          });
          wrapper.appendChild(dropdown);
        } catch { removeDropdown(); }
      }, 300);
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && input.value.trim()) {
        e.preventDefault();
        selectedPlaces.push({ name: input.value.trim() });
        renderChips();
        input.value = '';
        removeDropdown();
      }
    });

    document.addEventListener('click', e => {
      if (!wrapper.contains(e.target)) removeDropdown();
    });
  }

  setupPlaceAutocomplete();

  // ===== HELPERS =====
  function clearMap() {
    markers.forEach(m => map.removeLayer(m));
    markers = [];
    if (naiveLine) { map.removeLayer(naiveLine); naiveLine = null; }
    if (optimizedLine) { map.removeLayer(optimizedLine); optimizedLine = null; }
  }

  function setStatus(msg, isError = false) {
    const el = document.getElementById('status');
    el.style.color = isError ? '#f72585' : '#4cc9f0';
    el.innerHTML = msg;
  }

  function formatDist(meters) {
    return meters >= 1000
      ? (meters / 1000).toFixed(1) + ' км'
      : Math.round(meters) + ' м';
  }

  function formatMin(m) {
    const h = Math.floor(m / 60) % 24;
    const min = m % 60;
    return String(h).padStart(2,'0') + ':' + String(min).padStart(2,'0');
  }

  function makeIcon(color, label) {
    return L.divIcon({
      className: '',
      html: `<div style="
        background:${color};
        color:#fff;
        border-radius:50%;
        width:28px;height:28px;
        display:flex;align-items:center;justify-content:center;
        font-size:11px;font-weight:bold;
        border:2px solid rgba(255,255,255,0.7);
        box-shadow:0 2px 6px rgba(0,0,0,0.4);
      ">${label}</div>`,
      iconSize: [28, 28],
      iconAnchor: [14, 14]
    });
  }

  // ===== HISTORY =====
  const transportLabels = {'driving-car':'🚗','cycling-regular':'🚲','foot-walking':'🚶'};

  async function loadHistory() {
    const block = document.getElementById('historyBlock');
    try {
      const res = await fetch('/api/route/history');
      const routes = await res.json();
      block.innerHTML = '';
      if (!routes.length) {
        block.innerHTML = '<div style="font-size:0.8rem;color:#888;text-align:center">Нет сохранённых маршрутов</div>';
        block.style.display = 'flex';
        return;
      }
      routes.forEach(r => {
        const div = document.createElement('div');
        div.style.cssText = 'background:#0f3460;border-radius:8px;padding:8px 12px;font-size:0.78rem;border:1px solid transparent';
        const saving = r.savingPercent ? r.savingPercent.toFixed(1) + '%' : '0%';
        const tIcon = transportLabels[r.transportMode] || '🚗';
        const timeStr = r.totalTimeMinutes > 0 ? Math.floor(r.totalTimeMinutes/60) + 'ч ' + (r.totalTimeMinutes%60) + 'мин' : '—';
        const shortStart = (r.startAddress || '?').split(',').slice(0,2).join(',');
        const shortEnd = (r.endAddress || '?').split(',').slice(0,2).join(',');
        div.innerHTML = `<div style="color:#4cc9f0;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${shortStart} → ${shortEnd}</div>`
          + `<div style="color:#888;display:flex;gap:8px;flex-wrap:wrap"><span>${tIcon}</span><span>📍${r.poiCount || '?'}</span><span>⏱${timeStr}</span><span style="color:#4ade80">↓${saving}</span></div>`;
        block.appendChild(div);
      });
      const clearBtn = document.createElement('button');
      clearBtn.textContent = 'Очистить историю';
      clearBtn.style.cssText = 'padding:6px;border-radius:6px;border:1px solid #ef4444;background:transparent;color:#ef4444;cursor:pointer;font-size:0.78rem;transition:background 0.15s';
      clearBtn.onmouseenter = () => { clearBtn.style.background = '#ef4444'; clearBtn.style.color = '#fff'; };
      clearBtn.onmouseleave = () => { clearBtn.style.background = 'transparent'; clearBtn.style.color = '#ef4444'; };
      clearBtn.onclick = async () => {
        await fetch('/api/route/history', { method: 'DELETE' });
        block.innerHTML = '<div style="font-size:0.8rem;color:#888;text-align:center">Нет сохранённых маршрутов</div>';
      };
      block.appendChild(clearBtn);
      block.style.display = 'flex';
    } catch (e) { block.innerHTML = '<div style="color:#f72585;font-size:0.8rem">Ошибка загрузки</div>'; block.style.display = 'flex'; }
  }

  document.getElementById('historyBtn').addEventListener('click', () => {
    const block = document.getElementById('historyBlock');
    if (block.style.display === 'flex') { block.style.display = 'none'; return; }
    loadHistory();
  });

  // ===== BUILD ROUTE =====
  document.getElementById('buildBtn').addEventListener('click', async () => {
    const startAddress = document.getElementById('startAddr').value.trim();
    const endAddress   = document.getElementById('endAddr').value.trim();
    const categories   = [...document.querySelectorAll('.cat-item input:checked')].map(c => c.value);
    const maxPois      = parseInt(maxPoisInput.value);

    if (!startAddress) { setStatus('Введите начальную точку', true); return; }
    if (currentMode === 'categories') {
      if (!endAddress) { setStatus('Введите конечную точку', true); return; }
      if (categories.length === 0) { setStatus('Выберите хотя бы одну категорию', true); return; }
    } else {
      if (selectedPlaces.length === 0) { setStatus('Добавьте хотя бы одно место', true); return; }
    }

    const btn = document.getElementById('buildBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Строим маршрут...';
    setStatus('');
    clearMap();
    document.getElementById('results').style.display = 'none';

    const payload = {
      mode: currentMode,
      startAddress,
      transportMode,
      departureTime: document.getElementById('departureTime').value || '09:00',
      endTime: document.getElementById('endTime').value || '18:00'
    };
    if (currentMode === 'categories') {
      payload.endAddress = endAddress;
      payload.categories = categories;
      payload.categoryPriorities = collectCategoryPriorities();
      payload.maxPois = maxPois;
    } else {
      payload.places = selectedPlaces.map(p => p.name);
    }

    try {
      const resp = await fetch('/api/route/build', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!resp.ok) {
        const err = await resp.text();
        throw new Error(err || `HTTP ${resp.status}`);
      }

      const data = await resp.json();
      renderResult(data);

    } catch (e) {
      setStatus('Ошибка: ' + e.message, true);
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Построить маршрут';
    }
  });

  // ===== RENDER =====
  function renderResult(data) {
    const coords = data.orderedCoordinates;   // [{lat,lon}, ...]
    const pois   = data.pois || [];
    const bounds = [];

    // --- Start marker ---
    const start = coords[0];
    const startM = L.marker([start.lat, start.lon], { icon: makeIcon('#4cc9f0', 'A') })
      .bindPopup('<b>Старт</b>').addTo(map);
    markers.push(startM);
    bounds.push([start.lat, start.lon]);

    // --- POI markers ---
    pois.forEach((poi, i) => {
      let popupHtml = `<b>${poi.name}</b><br/><small>${poi.rubric || poi.category}</small>`;
      if (poi.rating) popupHtml += `<br/>★ ${poi.rating}` + (poi.reviews ? ` (${poi.reviews})` : '');
      if (poi.workingHours) popupHtml += `<br/>🕐 ${poi.workingHours}`;
      if (poi.address) popupHtml += `<br/><small style="color:#888">${poi.address}</small>`;
      const m = L.marker([poi.lat, poi.lon], { icon: makeIcon('#f59e0b', i + 1) })
        .bindPopup(popupHtml)
        .addTo(map);
      markers.push(m);
      bounds.push([poi.lat, poi.lon]);
    });

    // --- End marker ---
    const end = coords[coords.length - 1];
    const endM = L.marker([end.lat, end.lon], { icon: makeIcon('#4ade80', 'B') })
      .bindPopup('<b>Финиш</b>').addTo(map);
    markers.push(endM);
    bounds.push([end.lat, end.lon]);

    // --- Naive route (blue dashed) ---
    const coordsLatLon = coords.map(c => [c.lat, c.lon]);
    if (data.naiveGeojson && data.naiveGeojson.features) {
      naiveLine = L.geoJSON(data.naiveGeojson, {
        style: { color: '#ef4444', weight: 5, opacity: 0.9, dashArray: '10 8' }
      }).addTo(map);
    } else {
      naiveLine = L.polyline(coordsLatLon, {
        color: '#ef4444', weight: 5, opacity: 0.9, dashArray: '10 8'
      }).addTo(map);
    }

    // --- Optimized route (green) ---
    if (data.geojson && data.geojson.features) {
      optimizedLine = L.geoJSON(data.geojson, {
        style: { color: '#22c55e', weight: 4, opacity: 0.85 }
      }).addTo(map);
    } else {
      optimizedLine = L.polyline(coordsLatLon, {
        color: '#22c55e', weight: 4, opacity: 0.85
      }).addTo(map);
    }

    // --- Fit map ---
    if (bounds.length > 0) map.fitBounds(bounds, { padding: [40, 40] });

    // --- Stats ---
    document.getElementById('distBefore').textContent = formatDist(data.originalDistance || 0);
    document.getElementById('distAfter').textContent  = formatDist(data.optimizedDistance || 0);
    document.getElementById('saving').textContent     =
      data.savingPercent != null ? `${data.savingPercent.toFixed(1)}%` : '—';
    document.getElementById('compMs').textContent     =
      data.computationMs != null ? `${data.computationMs} мс` : '—';

    if (data.schedule && data.schedule.length > 0) {
      const depMin = parseInt(document.getElementById('departureTime').value.split(':')[0]) * 60
        + parseInt(document.getElementById('departureTime').value.split(':')[1]);
      const lastEnd = data.schedule[data.schedule.length - 1].visit_end_time;
      const totalMin = lastEnd - depMin;
      const h = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      document.getElementById('totalTime').textContent = (h > 0 ? h + ' ч ' : '') + m + ' мин';
    } else {
      document.getElementById('totalTime').textContent = '—';
    }

    // --- POI list ---
    const list = document.getElementById('poiList');
    list.innerHTML = '';
    const scheduledCount = data.schedule ? data.schedule.length : 0;
    pois.forEach((poi, i) => {
      const div = document.createElement('div');
      const missed = i >= scheduledCount;
      div.className = 'poi-item';
      if (missed) {
        div.style.borderLeft = '3px solid #ef4444';
        div.style.opacity = '0.7';
      }
      const sch = data.schedule && data.schedule[i];
      const timeStr = sch ? formatMin(sch.arrival_time) + '–' + formatMin(sch.visit_end_time) : '';
      const timeHtml = missed
        ? '<span class="poi-time" style="color:#ef4444">не успеваем</span>'
        : (timeStr ? `<span class="poi-time">${timeStr}</span>` : '');
      const ratingHtml = poi.rating ? `<span style="color:#facc15;font-size:0.75rem;flex-shrink:0">★${poi.rating}</span>` : '';
      div.innerHTML = `<div class="poi-num" ${missed ? 'style="background:#ef4444"' : ''}>${i+1}</div><span${missed ? ' style="color:#ef4444"' : ''}>${poi.name}</span>${ratingHtml}${timeHtml}`;
      div.style.cursor = 'pointer';
      div.addEventListener('click', () => {
        map.setView([poi.lat, poi.lon], 16);
        markers[i + 1].openPopup();
      });
      list.appendChild(div);
    });

    document.getElementById('results').style.display = 'flex';
    setStatus('');
  }
</script>
</body>
</html>
